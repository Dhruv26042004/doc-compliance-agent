services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://compliance:compliance@db:5432/compliance
      DATA_DIR: /data
      STORAGE_DIR: /storage
      EVAL_RESULTS_DIR: /eval/results
      LLM_CACHE_DIR: /eval/cache
      MODEL_CACHE_DIR: /storage/models
    volumes:
      # Writable so `scripts.bootstrap` can build the dataset and models inside the container.
      - ./data:/data
      - ./eval/results:/eval/results
      - ./eval/cache:/eval/cache
      - uploads:/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
