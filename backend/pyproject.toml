[project]
name = "compliance-api"
version = "0.1.0"
description = "Document compliance checker: policy-grounded LLM verdicts with human review"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "alembic>=1.20.1",
    "google-genai>=2.33.0",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
# The project lives in a OneDrive folder, which rejects uv's default hardlinks.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
